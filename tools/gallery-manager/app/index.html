<!doctype html>
<!--
  Gallery manager page. Vite serves this file and compiles main.tsx.
  The placeholder in the "manager-token" meta tag is replaced by the server
  with a secret created at start (see server.mjs). The app sends it with every request.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manager-token" content="%MANAGER_TOKEN%" />
    <title>Gallery Manager · Gemy Campei</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232e1f18'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia' font-size='30' fill='%23faf8f4'%3EGM%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
